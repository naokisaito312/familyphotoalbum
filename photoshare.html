<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Share</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; text-align: center; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input[type="file"], textarea { width: 100%; margin-bottom: 15px; box-sizing: border-box; }
        textarea { height: 80px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { width: 100%; padding: 12px; background: #8b5a2b; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:disabled { background: #ccc; }
        #preview { max-width: 100%; margin-bottom: 15px; display: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>写真をシェアする</h2>
        <input type="file" id="fileInput" accept="image/*">
        <img id="preview" alt="プレビュー">
        <textarea id="commentInput" placeholder="思い出のコメントを入力してください..."></textarea>
        <button id="uploadBtn">アルバムに送る</button>
    </div>

    <!-- Firebase SDK の読み込み -->
    <script type="module">
    	import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TODO: あなたのFirebaseプロジェクトの構成情報を貼り付けてください
        const firebaseConfig = {
          apiKey: "AIzaSyAt3p_mTcyr7XH0xSWcPI9VCU1mzzr4IEk",
          authDomain: "family-album-studio.firebaseapp.com",
          projectId: "family-album-studio",
          storageBucket: "family-album-studio.firebasestorage.app",
          messagingSenderId: "10247247724",
          appId: "1:10247247724:web:749f7f1c5f30397de2c549",
          measurementId: "G-TXM3QH522D"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const db = getFirestore(app);

        // URLから albumId を取得
        const urlParams = new URLSearchParams(window.location.search);
        const albumId = urlParams.get('albumId');

        if (!albumId) {
            alert("有効なアルバムURLではありません。");
        }

        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const commentInput = document.getElementById('commentInput');
        const uploadBtn = document.getElementById('uploadBtn');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) {
                alert('写真を選択してください');
                return;
            }
            if (!albumId) {
                alert('アルバムIDがありません。送信できません。');
                return;
            }

            uploadBtn.disabled = true;
            uploadBtn.innerText = '送信中...';

            try {
                const storageRef = ref(storage, 'photos/' + Date.now() + '_' + file.name);
                const snapshot = await uploadBytes(storageRef, file);
                const downloadURL = await getDownloadURL(snapshot.ref);

                // 保存データに albumId を追加
                await addDoc(collection(db, "shared_photos"), {
                    albumId: albumId, // ★ここを追加
                    imageUrl: downloadURL,
                    comment: commentInput.value,
                    createdAt: serverTimestamp()
                });

                alert('送信が完了しました！');
                fileInput.value = '';
                preview.style.display = 'none';
                commentInput.value = '';
            } catch (error) {
                console.error("Error uploading: ", error);
                alert('送信に失敗しました。');
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerText = 'アルバムに送る';
            }
        });
    </script>
</body>
</html>
