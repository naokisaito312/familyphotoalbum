<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Share</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; text-align: center; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input[type="file"], textarea { width: 100%; margin-bottom: 15px; box-sizing: border-box; }
        textarea { height: 80px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { width: 100%; padding: 12px; background: #8b5a2b; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:disabled { background: #ccc; }
        
        /* 複数プレビュー用のスタイル */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
            max-height: 240px;
            overflow-y: auto;
        }
        .preview-grid img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        #errorMsg { color: #d9534f; font-size: 13px; margin-top: 10px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h2>写真をシェアする</h2>
        <!-- multiple 属性を追加 -->
        <input type="file" id="fileInput" accept="image/*" multiple>
        
        <!-- 複数プレビュー用コンテナ -->
        <div id="previewGrid" class="preview-grid"></div>

        <textarea id="commentInput" placeholder="思い出のコメントを入力してください..."></textarea>
        <button id="uploadBtn">アルバムに送る</button>
        <div id="errorMsg"></div>
    </div>

    <!-- Firebase SDK (Firestoreのみ使用) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAt3p_mTcyr7XH0xSWcPI9VCU1mzzr4IEk",
          authDomain: "family-album-studio.firebaseapp.com",
          projectId: "family-album-studio",
          storageBucket: "family-album-studio.firebasestorage.app",
          messagingSenderId: "10247247724",
          appId: "1:10247247724:web:749f7f1c5f30397de2c549",
          measurementId: "G-TXM3QH522D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // URLから albumId を取得
        const urlParams = new URLSearchParams(window.location.search);
        const albumId = urlParams.get('albumId');

        const fileInput = document.getElementById('fileInput');
        const previewGrid = document.getElementById('previewGrid');
        const commentInput = document.getElementById('commentInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const errorMsg = document.getElementById('errorMsg');

        if (!albumId) {
            alert("有効なアルバムURLではありません。");
        }

        // 複数プレビュー表示処理
        fileInput.addEventListener('change', (e) => {
            previewGrid.innerHTML = '';
            const files = Array.from(e.target.files);

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    previewGrid.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        });

        // 画像をBase64文字列に変換・圧縮する関数
        function convertToBase64(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        // 一括アップロード処理
        uploadBtn.addEventListener('click', async () => {
            errorMsg.innerText = '';
            const files = Array.from(fileInput.files);

            if (files.length === 0) {
                alert('写真を選択してください');
                return;
            }
            if (!albumId) {
                alert('アルバムIDがありません。送信できません。');
                return;
            }

            uploadBtn.disabled = true;

            try {
                const total = files.length;
                
                for (let i = 0; i < total; i++) {
                    const file = files[i];
                    uploadBtn.innerText = `送信中... (${i + 1}/${total})`;

                    // 画像圧縮＆Base64変換
                    const base64Image = await convertToBase64(file);

                    // Firestoreへ保存
                    await addDoc(collection(db, "shared_photos"), {
                        albumId: albumId,
                        imageUrl: base64Image,
                        comment: commentInput.value,
                        createdAt: serverTimestamp()
                    });
                }

                alert(`${total}枚の送信が完了しました！`);
                fileInput.value = '';
                previewGrid.innerHTML = '';
                commentInput.value = '';
            } catch (error) {
                console.error("Error uploading: ", error);
                errorMsg.innerText = 'エラー詳細: ' + (error.message || error);
                alert('送信に失敗しました。');
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerText = 'アルバムに送る';
            }
        });
    </script>
</body>
</html>
