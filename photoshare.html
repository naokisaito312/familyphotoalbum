<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Share | Memory Album</title>
    <!-- Webフォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #f7a072;
            --primary-hover: #f38345;
            --text-main: #3d3531;
            --text-sub: #8c7d75;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.9);
            --shadow-card: 0 12px 30px -5px rgba(60, 40, 30, 0.1), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
            --shadow-btn: 0 8px 20px rgba(247, 160, 114, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #fefaf6 0%, #f7ede2 50%, #f5e6d8 100%);
            min-height: 100vh;
            color: var(--text-main);
            font-family: 'Quicksand', 'M PLUS Rounded 1c', -apple-system, sans-serif;
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: var(--shadow-card);
            text-align: center;
        }

        h2 {
            font-size: 1.5em;
            font-weight: 700;
            margin: 0 0 6px 0;
            background: linear-gradient(45deg, #4a3e3d, #8f6b58);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* ファイル選択ボタンのカスタム見た目 */
        .file-select-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: #ffffff;
            border: 2px dashed rgba(247, 160, 114, 0.6);
            border-radius: 16px;
            color: var(--primary-hover);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .file-select-btn:active {
            transform: scale(0.98);
            background: #fffefb;
        }

        input[type="file"] { display: none; }

        /* 複数写真＋個別コメントカードリスト */
        .photo-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 2px;
        }

        .photo-item {
            background: #ffffff;
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 6px 16px rgba(60, 40, 30, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .photo-item img {
            width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 12px;
            background: #faf7f4;
        }

        .photo-item textarea {
            width: 100%;
            height: 65px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(140, 125, 117, 0.2);
            background: #fdfbf7;
            font-family: inherit;
            font-size: 13px;
            color: var(--text-main);
            resize: none;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }

        .photo-item textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* 送信ボタン */
        .upload-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f7a072 0%, #f38345 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .upload-btn:active {
            transform: scale(0.98);
        }

        .upload-btn:disabled {
            background: #d8ceca;
            box-shadow: none;
            cursor: not-allowed;
        }

        #errorMsg {
            color: #e65b5b;
            font-size: 12px;
            font-weight: 500;
            margin-top: 12px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>写真をシェア</h2>
        <div class="subtitle">テレビのアルバムへ思い出を送ります</div>

        <!-- カスタムファイル選択ボタン -->
        <label for="fileInput" class="file-select-btn">
            <span>📷 写真を選ぶ (複数可)</span>
        </label>
        <input type="file" id="fileInput" accept="image/*" multiple>

        <!-- 選択した写真カード群 -->
        <div id="photoList" class="photo-list"></div>

        <button id="uploadBtn" class="upload-btn">アルバムに送る</button>
        <div id="errorMsg"></div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAt3p_mTcyr7XH0xSWcPI9VCU1mzzr4IEk",
          authDomain: "family-album-studio.firebaseapp.com",
          projectId: "family-album-studio",
          storageBucket: "family-album-studio.firebasestorage.app",
          messagingSenderId: "10247247724",
          appId: "1:10247247724:web:749f7f1c5f30397de2c549",
          measurementId: "G-TXM3QH522D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const albumId = urlParams.get('albumId');

        const fileInput = document.getElementById('fileInput');
        const photoList = document.getElementById('photoList');
        const uploadBtn = document.getElementById('uploadBtn');
        const errorMsg = document.getElementById('errorMsg');

        let selectedFilesData = [];

        if (!albumId) {
            alert("有効なアルバムURLではありません。");
        }

        fileInput.addEventListener('change', (e) => {
            photoList.innerHTML = '';
            selectedFilesData = [];
            const files = Array.from(e.target.files);

            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'photo-item';

                    const img = document.createElement('img');
                    img.src = event.target.result;

                    const textarea = document.createElement('textarea');
                    textarea.placeholder = `写真 ${index + 1} のコメントを入力...`;

                    selectedFilesData.push({
                        file: file,
                        textarea: textarea
                    });

                    itemDiv.appendChild(img);
                    itemDiv.appendChild(textarea);
                    photoList.appendChild(itemDiv);
                };
                reader.readAsDataURL(file);
            });
        });

        function convertToBase64(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        uploadBtn.addEventListener('click', async () => {
            errorMsg.innerText = '';

            if (selectedFilesData.length === 0) {
                alert('写真を選択してください');
                return;
            }
            if (!albumId) {
                alert('アルバムIDがありません。送信できません。');
                return;
            }

            uploadBtn.disabled = true;

            try {
                const total = selectedFilesData.length;
                
                for (let i = 0; i < total; i++) {
                    const item = selectedFilesData[i];
                    uploadBtn.innerText = `送信中... (${i + 1}/${total})`;

                    const base64Image = await convertToBase64(item.file);
                    const comment = item.textarea.value.trim();

                    await addDoc(collection(db, "shared_photos"), {
                        albumId: albumId,
                        imageUrl: base64Image,
                        comment: comment,
                        createdAt: serverTimestamp()
                    });
                }

                alert(`${total}枚の送信が完了しました！`);
                fileInput.value = '';
                photoList.innerHTML = '';
                selectedFilesData = [];
            } catch (error) {
                console.error("Error uploading: ", error);
                errorMsg.innerText = 'エラー詳細: ' + (error.message || error);
                alert('送信に失敗しました。');
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerText = 'アルバムに送る';
            }
        });
    </script>
</body>
</html>
