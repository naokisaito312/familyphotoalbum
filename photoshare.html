<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Share</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; text-align: center; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input[type="file"], textarea { width: 100%; margin-bottom: 15px; box-sizing: border-box; }
        textarea { height: 80px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { width: 100%; padding: 12px; background: #8b5a2b; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:disabled { background: #ccc; }
        #preview { max-width: 100%; margin-bottom: 15px; display: none; border-radius: 5px; }
        #errorMsg { color: #d9534f; font-size: 13px; margin-top: 10px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h2>写真をシェアする</h2>
        <input type="file" id="fileInput" accept="image/*">
        <img id="preview" alt="プレビュー">
        <textarea id="commentInput" placeholder="思い出のコメントを入力してください..."></textarea>
        <button id="uploadBtn">アルバムに送る</button>
        <div id="errorMsg"></div>
    </div>

    <!-- Firebase SDK (Firestoreのみ使用) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAt3p_mTcyr7XH0xSWcPI9VCU1mzzr4IEk",
          authDomain: "family-album-studio.firebaseapp.com",
          projectId: "family-album-studio",
          storageBucket: "family-album-studio.firebasestorage.app",
          messagingSenderId: "10247247724",
          appId: "1:10247247724:web:749f7f1c5f30397de2c549",
          measurementId: "G-TXM3QH522D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // URLから albumId を取得
        const urlParams = new URLSearchParams(window.location.search);
        const albumId = urlParams.get('albumId');

        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const commentInput = document.getElementById('commentInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const errorMsg = document.getElementById('errorMsg');

        if (!albumId) {
            alert("有効なアルバムURLではありません。");
        }

        // プレビュー表示
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // 画像をBase64文字列に変換・圧縮する関数 (Firestoreの容量制限1MB対策)
        function convertToBase64(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Base64データURLとして出力
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        uploadBtn.addEventListener('click', async () => {
            errorMsg.innerText = '';
            const file = fileInput.files[0];

            if (!file) {
                alert('写真を選択してください');
                return;
            }
            if (!albumId) {
                alert('アルバムIDがありません。送信できません。');
                return;
            }

            uploadBtn.disabled = true;
            uploadBtn.innerText = '画像を準備中...';

            try {
                // 画像をBase64テキストデータに変換
                const base64Image = await convertToBase64(file);

                uploadBtn.innerText = '送信中...';

                // Storageを使わず、Firestoreに画像データ(imageUrl)としてそのまま保存
                await addDoc(collection(db, "shared_photos"), {
                    albumId: albumId,
                    imageUrl: base64Image, // Base64データ文字列が入ります
                    comment: commentInput.value,
                    createdAt: serverTimestamp()
                });

                alert('送信が完了しました！');
                fileInput.value = '';
                preview.style.display = 'none';
                commentInput.value = '';
            } catch (error) {
                console.error("Error uploading: ", error);
                errorMsg.innerText = 'エラー詳細: ' + (error.message || error);
                alert('送信に失敗しました。');
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerText = 'アルバムに送る';
            }
        });
    </script>
</body>
</html>
