<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Memory Album Studio</title>
    <!-- Webフォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* --- ページ遷移アニメーション --- */
        ::view-transition-old(root) { animation: fade-zoom-out 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        ::view-transition-new(root) { animation: fade-zoom-in 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        @keyframes fade-zoom-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.96); } }
        @keyframes fade-zoom-in { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }

        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #fefaf6 0%, #f7ede2 50%, #f5e6d8 100%);
            min-height: 100vh;
            color: #3d3531;
            font-family: 'Quicksand', 'M PLUS Rounded 1c', -apple-system, sans-serif;
            margin: 0;
            padding: 40px;
        }

        /* --- フォーカス強調表示（TV GUI対応） --- */
        :focus { outline: none; }

        .focusable:focus {
            box-shadow: 0 0 0 4px #f7a072, 0 0 25px rgba(247, 160, 114, 0.65) !important;
            transform: translateY(-8px) scale(1.03) !important;
            z-index: 100 !important;
            border-color: #f7a072 !important;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin: 0 0 10px 0;
            background: linear-gradient(45deg, #4a3e3d, #8f6b58);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #8c7d75;
            font-size: 0.95em;
            font-weight: 500;
        }

        /* --- アルバムグリッド --- */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 35px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .album-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px -5px rgba(60, 40, 30, 0.08);
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ==========================================================================
           散らばる写真サムネイル（テーブルの上にバラまかれた写真）
           ========================================================================== */
        .photo-stack-wrapper {
            width: 100%;
            height: 200px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            perspective: 1000px;
        }

        .photo-stack-item {
            position: absolute;
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            background: #ffffff;
            padding: 6px 6px 18px 6px; /* ポラロイド風の下余白 */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15), 0 2px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* 重なり順と配置（背景の写真たち） */
        .photo-stack-item.scatter-0 { transform: translate(-45px, -15px) rotate(-14deg) scale(0.88); z-index: 1; opacity: 0.85; }
        .photo-stack-item.scatter-1 { transform: translate(45px, -10px) rotate(12deg) scale(0.9); z-index: 2; opacity: 0.9; }
        .photo-stack-item.scatter-2 { transform: translate(-30px, 15px) rotate(-6deg) scale(0.92); z-index: 3; }
        .photo-stack-item.scatter-3 { transform: translate(35px, 20px) rotate(8deg) scale(0.92); z-index: 4; }
        
        /* メイン写真（中央・最前面） */
        .photo-stack-item.main-photo {
            transform: translate(0, 0) rotate(-2deg) scale(1.05);
            z-index: 10;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.22), 0 4px 10px rgba(0, 0, 0, 0.12);
        }

        /* ホバー時に写真が少し広がる演出 */
        .album-card:hover .photo-stack-item.scatter-0 { transform: translate(-60px, -22px) rotate(-18deg) scale(0.88); }
        .album-card:hover .photo-stack-item.scatter-1 { transform: translate(60px, -15px) rotate(16deg) scale(0.9); }
        .album-card:hover .photo-stack-item.scatter-2 { transform: translate(-40px, 22px) rotate(-8deg) scale(0.92); }
        .album-card:hover .photo-stack-item.scatter-3 { transform: translate(45px, 25px) rotate(10deg) scale(0.92); }
        .album-card:hover .photo-stack-item.main-photo { transform: translate(0, -5px) rotate(0deg) scale(1.1); }

        /* 写真なし（プレースホルダー） */
        .no-photo-placeholder {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.03);
            border: 2px dashed #d8c8bc;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a08e85;
            font-size: 13px;
        }

        .album-title {
            font-size: 1.15em;
            font-weight: 700;
            color: #3d3531;
            margin: 5px 0 3px 0;
            text-align: center;
        }

        .album-count {
            font-size: 0.85em;
            color: #8c7d75;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <h1>Memory Album Studio</h1>
        <div class="subtitle">思い出のアルバムを選択してください</div>
    </header>

    <div class="album-grid" id="albumGrid"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, onSnapshot, query, where, getDocs, limit, orderBy 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAt3p_mTcyr7XH0xSWcPI9VCU1mzzr4IEk",
          authDomain: "family-album-studio.firebaseapp.com",
          projectId: "family-album-studio",
          storageBucket: "family-album-studio.firebasestorage.app",
          messagingSenderId: "10247247724",
          appId: "1:10247247724:web:749f7f1c5f30397de2c549",
          measurementId: "G-TXM3QH522D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const albumGrid = document.getElementById('albumGrid');

        // アルバム一覧のリアルタイム取得
        onSnapshot(collection(db, "albums"), async (snapshot) => {
            albumGrid.innerHTML = '';

            if (snapshot.empty) {
                albumGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #8c7d75;">アルバムが見つかりません。</div>';
                return;
            }

            for (const docSnap of snapshot.docs) {
                const albumData = docSnap.data();
                const albumId = docSnap.id;
                const albumTitle = albumData.name || albumData.title || "無題のアルバム";

                // 各アルバムから最新の写真を取得（orderByを使わず、取得後にJavaScriptで並び替え）
                const photosQuery = query(
                    collection(db, "shared_photos"),
                    where("albumId", "==", albumId)
                );
                
                const photoSnaps = await getDocs(photosQuery);
                const photoDocs = [];
                photoSnaps.forEach(p => photoDocs.push(p.data()));
                
                // 日付（createdAt）で降順（新しい順）に並び替え
                photoDocs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                
                // 写真URLのリストを取得（最大5枚）
                const photoList = photoDocs.slice(0, 5).map(p => p.imageUrl);
                photoSnaps.forEach(p => photoList.push(p.data().imageUrl));

                // カード要素作成
                const card = document.createElement('div');
                card.className = 'album-card focusable';
                card.tabIndex = 0;

                // サムネイル部分（テーブルに写真が散らばっているデザイン）
                let stackHtml = '<div class="photo-stack-wrapper">';
                if (photoList.length > 0) {
                    const mainPhotoUrl = photoList[0]; // 最新写真をメイン（中央）に
                    const bgPhotos = photoList.slice(1); // それ以外を背景へ

                    // 背景の写真たち（敷き詰める写真）
                    bgPhotos.forEach((url, idx) => {
                        stackHtml += `<img src="${url}" class="photo-stack-item scatter-${idx}" alt="sub memory">`;
                    });

                    // メイン写真（中央・最前面）
                    stackHtml += `<img src="${mainPhotoUrl}" class="photo-stack-item main-photo" alt="main memory">`;
                } else {
                    stackHtml += '<div class="no-photo-placeholder">写真がありません</div>';
                }
                stackHtml += '</div>';

                card.innerHTML = `
                    ${stackHtml}
                    <div class="album-title">${albumTitle}</div>
                    <div class="album-count">${photoSnaps.size > 0 ? `${photoSnaps.size} 枚の写真` : '0 枚'}</div>
                `;

                // クリックで該当アルバムへ遷移
                card.addEventListener('click', () => {
                    window.location.href = `albumcreate.html?albumId=${albumId}`;
                });

                albumGrid.appendChild(card);
            }

            // 初期フォーカス設定
            const firstCard = document.querySelector('.album-card.focusable');
            if (firstCard) firstCard.focus();
        });

        // TVリモコン・キーボード操作対応
        document.addEventListener('keydown', (e) => {
            const focusables = Array.from(document.querySelectorAll('.focusable'));
            if (focusables.length === 0) return;

            const active = document.activeElement;
            let index = focusables.indexOf(active);

            if (index === -1) {
                focusables[0].focus();
                return;
            }

            if (e.key === 'ArrowRight') {
                e.preventDefault();
                (focusables[index + 1] || focusables[0]).focus();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                (focusables[index - 1] || focusables[focusables.length - 1]).focus();
            } else if (e.key === 'Enter') {
                if (active) active.click();
            }
        });
    </script>
</body>
</html>
