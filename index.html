<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Our Memory Albums</title>
    <!-- Webフォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #f7a072;
            --primary-hover: #f38345;
            --text-main: #3d3531;
            --text-sub: #8c7d75;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.85);
            
            --shadow-card: 0 12px 30px -5px rgba(60, 40, 30, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
            --shadow-card-hover: 0 20px 40px -5px rgba(60, 40, 30, 0.18), 0 8px 16px -2px rgba(0, 0, 0, 0.06);
            --shadow-soft: 0 10px 30px rgba(180, 140, 120, 0.12);
            --focus-glow: 0 0 0 4px #f7a072, 0 0 20px rgba(247, 160, 114, 0.6);
        }

        /* --- ページ遷移アニメーション --- */
        ::view-transition-old(root) { animation: fade-zoom-out 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        ::view-transition-new(root) { animation: fade-zoom-in 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        @keyframes fade-zoom-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.96); } }
        @keyframes fade-zoom-in { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }

        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #fefaf6 0%, #f7ede2 50%, #f5e6d8 100%);
            min-height: 100vh;
            color: var(--text-main);
            font-family: 'Quicksand', 'M PLUS Rounded 1c', -apple-system, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- TV GUI風 フォーカス用スタイル（キーボード/フォーカス選択時） --- */
        :focus { outline: none; }

        .create-input:focus,
        .focusable:focus,
        .focusable.tv-focused {
            box-shadow: var(--focus-glow) !important;
            transform: scale(1.04) translateY(-4px) !important;
            z-index: 100;
            border-color: var(--primary-color) !important;
        }

        header { text-align: center; margin-bottom: 35px; }
        h1 {
            font-size: 2.5em; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px 0;
            background: linear-gradient(45deg, #4a3e3d, #8f6b58);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: var(--text-sub); font-size: 14px; font-weight: 500; margin: 0; }

        .create-form-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 24px; border-radius: 24px; box-shadow: var(--shadow-soft);
            width: 100%; max-width: 500px; margin-bottom: 45px; display: flex; gap: 12px;
        }

        .create-input {
            flex: 1; padding: 12px 18px; border: 1px solid rgba(140, 125, 117, 0.2);
            border-radius: 16px; font-size: 15px; font-family: inherit; color: var(--text-main);
            background: rgba(255, 255, 255, 0.9); transition: all 0.25s ease;
        }

        .create-btn {
            background: var(--primary-color); color: #ffffff; border: none; padding: 12px 24px;
            border-radius: 16px; font-size: 15px; font-weight: 700; font-family: inherit;
            cursor: pointer; box-shadow: 0 4px 12px rgba(247, 160, 114, 0.35); transition: all 0.25s ease;
            white-space: nowrap;
        }

        .albums-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px; width: 100%; max-width: 1000px;
        }

        .album-card {
            background: #ffffff; border-radius: 20px; padding: 20px; text-decoration: none;
            color: var(--text-main); box-shadow: var(--shadow-card);
            border: 1px solid rgba(255, 255, 255, 0.9); transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex; flex-direction: column; justify-content: space-between; min-height: 140px;
        }

        .album-card-header { display: flex; align-items: center; gap: 12px; }
        .album-icon {
            width: 44px; height: 44px; background: linear-gradient(135deg, #fef2eb 0%, #fde2d2 100%);
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: var(--primary-color); flex-shrink: 0;
        }
        .album-name { font-size: 17px; font-weight: 700; line-height: 1.3; margin: 0; color: #2b2523; word-break: break-word; }
        .album-date { font-size: 11px; font-weight: 700; color: var(--text-sub); text-align: right; margin-top: 15px; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-sub); font-size: 15px; }
    </style>
</head>
<body>

    <header>
        <h1>Our Memory Albums</h1>
        <p class="subtitle">大切な思い出を共有・保存するファミリーアルバム</p>
    </header>

    <div class="create-form-container">
        <input type="text" id="albumNameInput" class="create-input focusable" placeholder="新しいアルバム名を入力..." maxlength="30" tabindex="0">
        <button id="createBtn" class="create-btn focusable" tabindex="0">作成する</button>
    </div>

    <div class="albums-grid" id="albumsGrid"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAt3p_mTcyr7XH0xSWcPI9VCU1mzzr4IEk",
          authDomain: "family-album-studio.firebaseapp.com",
          projectId: "family-album-studio",
          storageBucket: "family-album-studio.firebasestorage.app",
          messagingSenderId: "10247247724",
          appId: "1:10247247724:web:749f7f1c5f30397de2c549",
          measurementId: "G-TXM3QH522D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const albumNameInput = document.getElementById('albumNameInput');
        const createBtn = document.getElementById('createBtn');
        const albumsGrid = document.getElementById('albumsGrid');

        // デフォルトフォーカス設定
        window.addEventListener('DOMContentLoaded', () => {
            albumNameInput.focus();
        });

        // --- TV GUI キーボードナビゲーションロジック ---
        function getFocusables() {
            return Array.from(document.querySelectorAll('.focusable'));
        }

        document.addEventListener('keydown', (e) => {
            const active = document.activeElement;
            const focusables = getFocusables();
            if (focusables.length === 0) return;

            let currentIndex = focusables.indexOf(active);
            if (currentIndex === -1) {
                focusables[0].focus();
                return;
            }

            // Bキー（'b' または 'B'）で画面移動（前の画面 / 戻る）
            if (e.key === 'b' || e.key === 'B') {
                if (active !== albumNameInput || albumNameInput.value === '') {
                    window.history.back();
                    return;
                }
            }

            // 入力欄で文字入力中の横矢印キーはテキスト編集を優先
            const isEditingInput = active === albumNameInput && (e.key === 'ArrowLeft' || e.key === 'ArrowRight');

            if (e.key === 'ArrowRight' && !isEditingInput) {
                e.preventDefault();
                const next = focusables[currentIndex + 1] || focusables[0];
                next.focus();
            } else if (e.key === 'ArrowLeft' && !isEditingInput) {
                e.preventDefault();
                const prev = focusables[currentIndex - 1] || focusables[focusables.length - 1];
                prev.focus();
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                // 下キーでグリッド内の要素または次の要素へ移動
                const activeRect = active.getBoundingClientRect();
                let bestMatch = null;
                let minDistance = Infinity;

                focusables.forEach(elem => {
                    const rect = elem.getBoundingClientRect();
                    if (rect.top > activeRect.top + 10) {
                        const dist = Math.hypot(rect.left - activeRect.left, rect.top - activeRect.top);
                        if (dist < minDistance) {
                            minDistance = dist;
                            bestMatch = elem;
                        }
                    }
                });
                if (bestMatch) bestMatch.focus();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                // 上キーで前の要素へ移動
                const activeRect = active.getBoundingClientRect();
                let bestMatch = null;
                let minDistance = Infinity;

                focusables.forEach(elem => {
                    const rect = elem.getBoundingClientRect();
                    if (rect.top < activeRect.top - 10) {
                        const dist = Math.hypot(rect.left - activeRect.left, rect.top - activeRect.top);
                        if (dist < minDistance) {
                            minDistance = dist;
                            bestMatch = elem;
                        }
                    }
                });
                if (bestMatch) bestMatch.focus();
            } else if (e.key === 'Enter') {
                if (active && active.click) {
                    active.click();
                }
            }
        });

        // アルバム新規作成処理
        createBtn.addEventListener('click', async () => {
            const name = albumNameInput.value.trim();
            if (!name) {
                alert('アルバム名を入力してください');
                return;
            }

            createBtn.disabled = true;
            try {
                const docRef = await addDoc(collection(db, "albums"), {
                    name: name,
                    createdAt: serverTimestamp()
                });
                albumNameInput.value = '';
                window.location.href = `albumcreate.html?albumId=${docRef.id}`;
            } catch (error) {
                console.error("アルバム作成エラー:", error);
                alert("作成に失敗しました。");
            } finally {
                createBtn.disabled = false;
            }
        });

        // リアルタイム取得
        const q = query(collection(db, "albums"), orderBy("createdAt", "desc"));
        
        onSnapshot(q, (snapshot) => {
            albumsGrid.innerHTML = '';

            if (snapshot.empty) {
                albumsGrid.innerHTML = '<div class="empty-state">アルバムがまだありません。<br>上のフォームから最初のアルバムを作成してみましょう！</div>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const albumId = docSnap.id;

                let dateStr = '';
                if (data.createdAt) {
                    const date = data.createdAt.toDate();
                    dateStr = `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()}`;
                }

                const card = document.createElement('a');
                card.className = 'album-card focusable';
                card.tabIndex = 0;
                card.href = `albumcreate.html?albumId=${albumId}`;
                card.innerHTML = `
                    <div class="album-card-header">
                        <div class="album-icon">📖</div>
                        <h2 class="album-name">${data.name || '無題のアルバム'}</h2>
                    </div>
                    <div class="album-date">${dateStr}</div>
                `;
                albumsGrid.appendChild(card);
            });
        });
    </script>
</body>
</html>
