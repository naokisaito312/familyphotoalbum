<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memory Albums</title>
    <!-- Webフォント（Quicksand / M PLUS Rounded 1c） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #f7a072;
            --primary-hover: #f38345;
            --text-main: #3d3531;
            --text-sub: #8c7d75;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.85);
            
            --shadow-card: 0 12px 30px -5px rgba(60, 40, 30, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
            --shadow-card-hover: 0 20px 40px -5px rgba(60, 40, 30, 0.18), 0 8px 16px -2px rgba(0, 0, 0, 0.06);
            --shadow-soft: 0 10px 30px rgba(180, 140, 120, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fefaf6 0%, #f7ede2 50%, #f5e6d8 100%);
            min-height: 100vh;
            color: var(--text-main);
            font-family: 'Quicksand', 'M PLUS Rounded 1c', -apple-system, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- ヘッダー --- */
        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 8px 0;
            background: linear-gradient(45deg, #4a3e3d, #8f6b58);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 500;
            margin: 0;
        }

        /* --- アルバム新規作成フォーム（ガラスモフィズム） --- */
        .create-form-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 24px;
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
            width: 100%;
            max-width: 500px;
            margin-bottom: 45px;
            display: flex;
            gap: 12px;
        }

        .create-input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid rgba(140, 125, 117, 0.2);
            border-radius: 16px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.9);
            outline: none;
            transition: all 0.2s ease;
        }

        .create-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(247, 160, 114, 0.25);
            background: #ffffff;
        }

        .create-btn {
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(247, 160, 114, 0.35);
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .create-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(243, 131, 69, 0.45);
        }

        /* --- アルバム一覧グリッド --- */
        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }

        /* アルバムカード */
        .album-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
        }

        .album-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-card-hover);
        }

        /* アルバムアイコンとタイトル */
        .album-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .album-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #fef2eb 0%, #fde2d2 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--primary-color);
            flex-shrink: 0;
        }

        .album-name {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.3;
            margin: 0;
            color: #2b2523;
            word-break: break-word;
        }

        /* 作成日時 */
        .album-date {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            text-align: right;
            margin-top: 15px;
        }

        /* 空の状態の表示 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Our Memory Albums</h1>
        <p class="subtitle">大切な思い出を共有・保存するファミリーアルバム</p>
    </header>

    <!-- アルバム新規作成 -->
    <div class="create-form-container">
        <input type="text" id="albumNameInput" class="create-input" placeholder="新しいアルバム名を入力..." maxlength="30">
        <button id="createBtn" class="create-btn">作成する</button>
    </div>

    <!-- アルバム一覧表示エリア -->
    <div class="albums-grid" id="albumsGrid"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAt3p_mTcyr7XH0xSWcPI9VCU1mzzr4IEk",
          authDomain: "family-album-studio.firebaseapp.com",
          projectId: "family-album-studio",
          storageBucket: "family-album-studio.firebasestorage.app",
          messagingSenderId: "10247247724",
          appId: "1:10247247724:web:749f7f1c5f30397de2c549",
          measurementId: "G-TXM3QH522D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const albumNameInput = document.getElementById('albumNameInput');
        const createBtn = document.getElementById('createBtn');
        const albumsGrid = document.getElementById('albumsGrid');

        // アルバム新規作成処理
        createBtn.addEventListener('click', async () => {
            const name = albumNameInput.value.trim();
            if (!name) {
                alert('アルバム名を入力してください');
                return;
            }

            createBtn.disabled = true;
            try {
                const docRef = await addDoc(collection(db, "albums"), {
                    name: name,
                    createdAt: serverTimestamp()
                });
                albumNameInput.value = '';
                // 作成されたアルバムページへ移動
                window.location.href = `albumcreate.html?albumId=${docRef.id}`;
            } catch (error) {
                console.error("アルバム作成エラー:", error);
                alert("作成に失敗しました。");
            } finally {
                createBtn.disabled = false;
            }
        });

        // Enterキーで作成できるようにする
        albumNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                createBtn.click();
            }
        });

        // アルバム一覧のリアルタイム取得
        const q = query(collection(db, "albums"), orderBy("createdAt", "desc"));
        
        onSnapshot(q, (snapshot) => {
            albumsGrid.innerHTML = '';

            if (snapshot.empty) {
                albumsGrid.innerHTML = '<div class="empty-state">アルバムがまだありません。<br>上のフォームから最初のアルバムを作成してみましょう！</div>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const albumId = docSnap.id;

                let dateStr = '';
                if (data.createdAt) {
                    const date = data.createdAt.toDate();
                    dateStr = `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()}`;
                }

                const card = document.createElement('a');
                card.className = 'album-card';
                card.href = `albumcreate.html?albumId=${albumId}`;
                card.innerHTML = `
                    <div class="album-card-header">
                        <div class="album-icon">📖</div>
                        <h2 class="album-name">${data.name || '無題のアルバム'}</h2>
                    </div>
                    <div class="album-date">${dateStr}</div>
                `;
                albumsGrid.appendChild(card);
            });
        });
    </script>
</body>
</html>
