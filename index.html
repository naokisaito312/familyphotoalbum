<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Memory Album Studio</title>
    <!-- Webフォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* --- ページ遷移アニメーション --- */
        ::view-transition-old(root) { animation: fade-zoom-out 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        ::view-transition-new(root) { animation: fade-zoom-in 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        @keyframes fade-zoom-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.96); } }
        @keyframes fade-zoom-in { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }

        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #fefaf6 0%, #f7ede2 50%, #f5e6d8 100%);
            min-height: 100vh;
            color: #3d3531;
            font-family: 'Quicksand', 'M PLUS Rounded 1c', -apple-system, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-x: hidden;
        }

        /* --- フォーカス強調表示（TV GUI対応） --- */
        :focus { outline: none; }

        .focusable:focus, .modal-focusable:focus {
            box-shadow: 0 0 0 4px #f7a072, 0 0 25px rgba(247, 160, 114, 0.65) !important;
            transform: translateY(-4px) scale(1.02) !important;
            z-index: 100 !important;
            border-color: #f7a072 !important;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.8em;
            font-weight: 700;
            margin: 0 0 10px 0;
            background: linear-gradient(45deg, #4a3e3d, #8f6b58);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #8c7d75;
            font-size: 1.1em;
            font-weight: 500;
        }

        /* --- アルバム横一列レイアウト --- */
        .album-container {
            display: flex;
            gap: 40px;
            max-width: 1700px;
            margin: 0 auto;
            padding: 30px 20px;
            width: 100%;
            overflow-x: auto;
            align-items: center;
            justify-content: flex-start;
        }

        /* アルバムが1つもない（作成カードのみの）場合は中央に配置 */
        .album-container.has-empty-state {
            justify-content: center;
        }

        .album-card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            position: relative;
        }

        .album-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px -8px rgba(60, 40, 30, 0.1);
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 360px;
            height: 420px;
        }

        /* 新規作成用カード（サイズを大きく調整） */
        .create-album-card {
            border: 2px dashed #e2cfc4;
            background: rgba(255, 255, 255, 0.5);
            justify-content: center;
            align-items: center;
            height: 420px;
            width: 360px;
        }

        .create-album-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #f7a072;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(247, 160, 114, 0.35);
        }

        .create-album-text {
            font-size: 1.25em;
            font-weight: 700;
            color: #4a3e3d;
        }

        /* 写真サムネイルスタック（カード拡大に伴いサイズアップ） */
        .photo-stack-wrapper {
            width: 100%;
            height: 260px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            perspective: 1000px;
        }

        .photo-stack-item {
            position: absolute;
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            background: #ffffff;
            padding: 8px 8px 22px 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15), 0 2px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .photo-stack-item.scatter-0 { transform: translate(-55px, -15px) rotate(-14deg) scale(0.88); z-index: 1; opacity: 0.85; }
        .photo-stack-item.scatter-1 { transform: translate(55px, -10px) rotate(12deg) scale(0.9); z-index: 2; opacity: 0.9; }
        .photo-stack-item.scatter-2 { transform: translate(-35px, 18px) rotate(-6deg) scale(0.92); z-index: 3; }
        .photo-stack-item.scatter-3 { transform: translate(40px, 22px) rotate(8deg) scale(0.92); z-index: 4; }
        .photo-stack-item.main-photo {
            transform: translate(0, 0) rotate(-2deg) scale(1.05);
            z-index: 10;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.22), 0 4px 10px rgba(0, 0, 0, 0.12);
        }

        .album-card:hover .photo-stack-item.scatter-0, .album-card:focus .photo-stack-item.scatter-0 { transform: translate(-70px, -20px) rotate(-18deg) scale(0.88); }
        .album-card:hover .photo-stack-item.scatter-1, .album-card:focus .photo-stack-item.scatter-1 { transform: translate(70px, -15px) rotate(16deg) scale(0.9); }
        .album-card:hover .photo-stack-item.scatter-2, .album-card:focus .photo-stack-item.scatter-2 { transform: translate(-45px, 24px) rotate(-8deg) scale(0.92); }
        .album-card:hover .photo-stack-item.scatter-3, .album-card:focus .photo-stack-item.scatter-3 { transform: translate(50px, 28px) rotate(10deg) scale(0.92); }
        .album-card:hover .photo-stack-item.main-photo, .album-card:focus .photo-stack-item.main-photo { transform: translate(0, -5px) rotate(0deg) scale(1.1); }

        .no-photo-placeholder {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.03);
            border: 2px dashed #d8c8bc;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a08e85;
            font-size: 15px;
            font-weight: 500;
        }

        .album-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #3d3531;
            margin: 5px 0 5px 0;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .album-count {
            font-size: 0.95em;
            color: #8c7d75;
            font-weight: 500;
        }

        /* --- ゴミ箱削除ボタン（アルバムカード下部） --- */
        .delete-album-btn {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e2cfc4;
            color: #d9534f;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            transition: all 0.2s;
        }
        .delete-album-btn:hover {
            background: #d9534f;
            color: #ffffff;
            border-color: #d9534f;
            transform: scale(1.08);
        }

        /* --- モーダルポップアップ --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(61, 53, 49, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #ffffff;
            padding: 35px;
            border-radius: 24px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        .modal-title {
            font-size: 1.4em;
            font-weight: 700;
            color: #3d3531;
            margin-bottom: 20px;
        }
        .modal-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.1em;
            font-family: inherit;
            border: 2px solid #e2cfc4;
            border-radius: 12px;
            margin-bottom: 25px;
            color: #3d3531;
            background: #fefaf6;
            transition: border-color 0.2s;
        }
        .modal-input:focus {
            border-color: #f7a072;
            outline: none;
            box-shadow: 0 0 0 3px rgba(247, 160, 114, 0.2);
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .modal-btn {
            flex: 1;
            padding: 14px;
            font-size: 1.05em;
            font-weight: 700;
            font-family: inherit;
            border-radius: 12px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .modal-btn.cancel {
            background: #f1eae2;
            color: #8c7d75;
        }
        .modal-btn.cancel:hover {
            background: #e5ded5;
        }
        .modal-btn.submit {
            background: #f7a072;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(247, 160, 114, 0.3);
        }
        .modal-btn.submit:hover {
            background: #e89163;
        }
    </style>
</head>
<body>

    <header>
        <h1>Memory Album Studio</h1>
        <div class="subtitle">思い出のアルバムを選択してください</div>
    </header>

    <div class="album-container" id="albumContainer"></div>

    <!-- アルバム名入力モーダル -->
    <div class="modal-overlay" id="createModal">
        <div class="modal-content">
            <div class="modal-title">新しいアルバムを作成</div>
            <input type="text" id="albumNameInput" class="modal-input modal-focusable" placeholder="アルバム名を入力してください" value="家族の思い出">
            <div class="modal-buttons">
                <button type="button" class="modal-btn cancel modal-focusable" id="cancelModalBtn">キャンセル</button>
                <button type="button" class="modal-btn submit modal-focusable" id="submitModalBtn">作成する</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, onSnapshot, query, where, getDocs, addDoc, deleteDoc, doc, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAt3p_mTcyr7XH0xSWcPI9VCU1mzzr4IEk",
          authDomain: "family-album-studio.firebaseapp.com",
          projectId: "family-album-studio",
          storageBucket: "family-album-studio.firebasestorage.app",
          messagingSenderId: "10247247724",
          appId: "1:10247247724:web:749f7f1c5f30397de2c549",
          measurementId: "G-TXM3QH522D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const albumContainer = document.getElementById('albumContainer');
        const createModal = document.getElementById('createModal');
        const albumNameInput = document.getElementById('albumNameInput');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const submitModalBtn = document.getElementById('submitModalBtn');

        let isModalOpen = false;

        function openCreateModal() {
            isModalOpen = true;
            createModal.classList.add('active');
            albumNameInput.value = "家族の思い出";
            setTimeout(() => {
                albumNameInput.focus();
                albumNameInput.select();
            }, 100);
        }

        function closeCreateModal() {
            isModalOpen = false;
            createModal.classList.remove('active');
            const createCard = document.querySelector('.create-album-card');
            if (createCard) createCard.focus();
        }

        cancelModalBtn.addEventListener('click', closeCreateModal);

        async function handleCreateAlbum() {
            const albumName = albumNameInput.value.trim() || "無題のアルバム";
            try {
                const newAlbumRef = await addDoc(collection(db, "albums"), {
                    name: albumName,
                    theme: "default",
                    createdAt: serverTimestamp()
                });
                window.location.href = `albumcreate.html?albumId=${newAlbumRef.id}`;
            } catch (error) {
                console.error("アルバムの作成に失敗しました:", error);
                alert("アルバムの作成に失敗しました。");
            }
        }

        submitModalBtn.addEventListener('click', handleCreateAlbum);
        
        albumNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleCreateAlbum();
            }
        });

        // アルバム削除処理
        async function deleteAlbum(albumId, albumTitle) {
            if (!confirm(`「${albumTitle}」を削除してもよろしいですか？\n（紐づく写真はアルバム作成画面から個別に管理できます）`)) return;
            try {
                // アルバム自体の削除
                await deleteDoc(doc(db, "albums", albumId));
            } catch (error) {
                console.error("アルバムの削除に失敗しました:", error);
                alert("アルバムの削除に失敗しました。");
            }
        }

        // アルバム一覧のリアルタイム取得
        onSnapshot(collection(db, "albums"), async (snapshot) => {
            if (isModalOpen) return;
            
            albumContainer.innerHTML = '';

            if (snapshot.empty) {
                albumContainer.classList.add('has-empty-state');
            } else {
                albumContainer.classList.remove('has-empty-state');
            }

            // 1. 「新しいアルバムを作成する」カードを先頭に追加
            const createWrapper = document.createElement('div');
            createWrapper.className = 'album-card-wrapper';
            
            const createCard = document.createElement('div');
            createCard.className = 'album-card create-album-card focusable';
            createCard.tabIndex = 0;
            createCard.innerHTML = `
                <div class="create-album-icon">＋</div>
                <div class="create-album-text">新しいアルバムを作成する</div>
            `;
            createCard.addEventListener('click', openCreateModal);
            createWrapper.appendChild(createCard);
            albumContainer.appendChild(createWrapper);

            // 2. 既存のアルバムカードを追加
            for (const docSnap of snapshot.docs) {
                const albumData = docSnap.data();
                const albumId = docSnap.id;
                const albumTitle = albumData.name || albumData.title || "無題のアルバム";

                const photosQuery = query(
                    collection(db, "shared_photos"),
                    where("albumId", "==", albumId)
                );
                
                const photoSnaps = await getDocs(photosQuery);
                const photoDocs = [];
                photoSnaps.forEach(p => photoDocs.push(p.data()));
                
                photoDocs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                const photoList = photoDocs.slice(0, 5).map(p => p.imageUrl);

                const wrapper = document.createElement('div');
                wrapper.className = 'album-card-wrapper';

                const card = document.createElement('div');
                card.className = 'album-card focusable';
                card.tabIndex = 0;

                let stackHtml = '<div class="photo-stack-wrapper">';
                if (photoList.length > 0) {
                    const mainPhotoUrl = photoList[0];
                    const bgPhotos = photoList.slice(1);

                    bgPhotos.forEach((url, idx) => {
                        stackHtml += `<img src="${url}" class="photo-stack-item scatter-${idx}" alt="sub memory">`;
                    });

                    stackHtml += `<img src="${mainPhotoUrl}" class="photo-stack-item main-photo" alt="main memory">`;
                } else {
                    stackHtml += '<div class="no-photo-placeholder">写真がありません</div>';
                }
                stackHtml += '</div>';

                card.innerHTML = `
                    ${stackHtml}
                    <div class="album-title">${albumTitle}</div>
                    <div class="album-count">${photoSnaps.size > 0 ? `${photoSnaps.size} 枚の写真` : '0 枚'}</div>
                `;

                card.addEventListener('click', () => {
                    window.location.href = `albumcreate.html?albumId=${albumId}`;
                });

                wrapper.appendChild(card);

                // アルバムカード下部のゴミ箱アイコン（削除ボタン）
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-album-btn focusable';
                deleteBtn.tabIndex = 0;
                deleteBtn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                `;
                deleteBtn.title = "アルバムを削除";
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteAlbum(albumId, albumTitle);
                });

                wrapper.appendChild(deleteBtn);
                albumContainer.appendChild(wrapper);
            }

            const firstCard = document.querySelector('.focusable');
            if (firstCard && !isModalOpen) firstCard.focus();
        });

        // キーボード・TVリモコン操作対応（横一列移動 & 上下移動で削除ボタンと切り替え）
        document.addEventListener('keydown', (e) => {
            if (isModalOpen) {
                const modalFocusables = Array.from(document.querySelectorAll('.modal-focusable'));
                const active = document.activeElement;
                let index = modalFocusables.indexOf(active);

                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    (modalFocusables[index + 1] || modalFocusables[0]).focus();
                } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    (modalFocusables[index - 1] || modalFocusables[modalFocusables.length - 1]).focus();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closeCreateModal();
                }
                return;
            }

            const active = document.activeElement;
            const focusables = Array.from(document.querySelectorAll('.focusable'));
            if (focusables.length === 0) return;

            if (!focusables.includes(active)) {
                focusables[0].focus();
                return;
            }

            const index = focusables.indexOf(active);

            if (e.key === 'ArrowRight') {
                e.preventDefault();
                const nextEl = focusables[(index + 1) % focusables.length];
                nextEl.focus();
                nextEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                const prevEl = focusables[(index - 1 + focusables.length) % focusables.length];
                prevEl.focus();
                prevEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                const wrapper = active.closest('.album-card-wrapper');
                const deleteBtn = wrapper ? wrapper.querySelector('.delete-album-btn') : null;
                if (deleteBtn && active !== deleteBtn) {
                    deleteBtn.focus();
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                const wrapper = active.closest('.album-card-wrapper');
                const card = wrapper ? wrapper.querySelector('.album-card') : null;
                if (card && active !== card) {
                    card.focus();
                }
            } else if (e.key === 'Enter') {
                if (active) active.click();
            }
        });
    </script>
</body>
</html>
