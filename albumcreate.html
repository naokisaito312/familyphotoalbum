<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Our Memory Album</title>
    <style>
        body {
            background-color: #2c1d11;
            background-image: radial-gradient(rgba(0,0,0,0.3) 20%, transparent 80%);
            color: #f5ebe0;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 40px;
            overflow-y: hidden;
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            margin-bottom: 30px;
            color: #e6ccb2;
        }
        .album-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
            padding: 20px;
            height: 70vh;
            scroll-behavior: smooth;
        }
        .photo-card {
            display: inline-block;
            background: #fdfbf7;
            padding: 15px 15px 30px 15px;
            margin: 0 25px;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.5);
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
            flex-shrink: 0;
            width: 250px;
            position: relative;
        }
        .photo-card:nth-child(even) { transform: rotate(3deg); }
        .photo-card:hover {
            transform: scale(1.05) rotate(0deg);
            z-index: 10;
        }
        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(139, 90, 43, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background 0.2s;
            opacity: 0;
            z-index: 2;
        }
        .photo-card:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: #d9534f; }
        .photo-card img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            filter: sepia(0.3) contrast(0.9) brightness(0.95);
            border: 1px solid #ddd;
        }
        .photo-comment {
            margin-top: 15px;
            font-family: 'Courier New', Courier, monospace;
            color: #4a3b32;
            font-size: 14px;
            white-space: normal;
            word-wrap: break-word;
            text-align: center;
        }
        .photo-date {
            font-size: 11px;
            color: #8c7a6b;
            text-align: right;
            margin-top: 5px;
        }
        .qr-container {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #fdfbf7;
            padding: 12px;
            box-shadow: 3px 5px 15px rgba(0,0,0,0.5);
            border-radius: 4px;
            text-align: center;
            z-index: 100;
            transform: rotate(1deg);
            border: 1px solid #ddd;
            width: 120px;
        }
        .qr-container img {
            width: 120px;
            height: 120px;
            display: block;
            margin: 0 auto;
        }
        .qr-text {
            font-size: 10px;
            color: #4a3b32;
            margin-top: 8px;
            font-family: sans-serif;
            white-space: normal;
            font-weight: bold;
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <div class="qr-container" id="qrContainer">
        <img id="qrImage" src="" alt="QR Code">
        <div class="qr-text">スマホでスキャンして<br>写真を送る</div>
    </div>
    
    <h1>Our Memory Album</h1>
    <div class="album-container" id="albumContainer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAt3p_mTcyr7XH0xSWcPI9VCU1mzzr4IEk",
          authDomain: "family-album-studio.firebaseapp.com",
          projectId: "family-album-studio",
          storageBucket: "family-album-studio.firebasestorage.app",
          messagingSenderId: "10247247724",
          appId: "1:10247247724:web:749f7f1c5f30397de2c549",
          measurementId: "G-TXM3QH522D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const albumId = urlParams.get('albumId');

        if (!albumId) {
            alert("アルバムIDが見つかりません。一覧に戻ります。");
            window.location.href = "index.html";
        }

        // --- QRコード自動生成処理（より確実にphotoshare.htmlを指すように変更） ---
        const baseUrl = window.location.origin + window.location.pathname.replace(/albumcreate\.html$/, '');
        const shareUrl = `${baseUrl}photoshare.html?albumId=${albumId}`;
        const qrImage = document.getElementById('qrImage');
        qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(shareUrl)}`;
        // ----------------------------

        const albumContainer = document.getElementById('albumContainer');

        const q = query(collection(db, "shared_photos"), where("albumId", "==", albumId));
        
        onSnapshot(q, (snapshot) => {
            albumContainer.innerHTML = '';
            
            const photos = [];
            snapshot.forEach((doc) => {
                photos.push({ id: doc.id, ...doc.data() });
            });
            photos.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

            photos.forEach((data) => {
                let dateStr = '';
                if (data.createdAt) {
                    const date = data.createdAt.toDate();
                    dateStr = `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
                }

                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <button class="delete-btn" data-id="${data.id}">×</button>
                    <img src="${data.imageUrl}" alt="Memory">
                    <div class="photo-comment">${data.comment || ''}</div>
                    <div class="photo-date">${dateStr}</div>
                `;
                albumContainer.appendChild(card);
            });

            const deleteButtons = document.querySelectorAll('.delete-btn');
            deleteButtons.forEach(button => {
                button.addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    try {
                        await deleteDoc(doc(db, "shared_photos", id));
                    } catch (firestoreError) {
                        console.error("Firestoreの削除エラー:", firestoreError);
                    }
                });
            });

            albumContainer.scrollLeft = albumContainer.scrollWidth;
        });
    </script>
</body>
</html>
