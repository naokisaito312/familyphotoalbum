<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Memory Album</title>
    <!-- Webフォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Quicksand:wght@500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           デザインテーマ ＆ カードデザイン拡張
           ========================================================================== */
        /* --- 1. デフォルト: 暖色クラシック (ポラロイド・あたたかみ) --- */
        :root, body[data-theme="default"] {
            --bg-gradient: linear-gradient(135deg, #fefaf6 0%, #f7ede2 50%, #f5e6d8 100%);
            --primary-color: #f7a072;
            --primary-hover: #f38345;
            --text-main: #3d3531;
            --text-sub: #8c7d75;
            --card-bg: #ffffff;
            --card-border: 1px solid rgba(255, 255, 255, 0.9);
            --card-radius: 16px;
            --card-shadow: 0 15px 35px -5px rgba(60, 40, 30, 0.12), 0 5px 15px -3px rgba(0, 0, 0, 0.05);
            --img-radius: 10px;
            --title-font: 'Quicksand', 'M PLUS Rounded 1c', sans-serif;
            --title-gradient: linear-gradient(45deg, #4a3e3d, #8f6b58);
            --note-bg: #fffdf0;
            --note-border: 3px solid #f2e394;
            --note-radius: 4px 4px 12px 4px;
            --note-transform: rotate(-1deg);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.85);
            --focus-glow: 0 0 0 4px #f7a072, 0 0 25px rgba(247, 160, 114, 0.65);
        }

        /* --- 2. パステルスイート (ポップ・マステ風装飾) --- */
        body[data-theme="pastel"] {
            --bg-gradient: linear-gradient(135deg, #fff5f7 0%, #ffedf2 50%, #f0fff4 100%);
            --primary-color: #ff9ebb;
            --primary-hover: #ff7599;
            --text-main: #4a353d;
            --text-sub: #9e7d89;
            --card-bg: #ffffff;
            --card-border: 2px dashed #ffc0d0;
            --card-radius: 24px;
            --card-shadow: 0 12px 28px rgba(255, 180, 200, 0.2);
            --img-radius: 16px;
            --title-font: 'M PLUS Rounded 1c', sans-serif;
            --title-gradient: linear-gradient(45deg, #633b4d, #a86b84);
            --note-bg: #fffbf3;
            --note-border: 2px solid #ffd185;
            --note-radius: 12px;
            --note-transform: rotate(1deg);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.9);
            --focus-glow: 0 0 0 4px #ff9ebb, 0 0 25px rgba(255, 158, 187, 0.65);
        }
        body[data-theme="pastel"] .photo-card::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            width: 70px;
            height: 20px;
            background: rgba(255, 220, 150, 0.7);
            border-left: 2px dashed rgba(255,255,255,0.5);
            border-right: 2px dashed rgba(255,255,255,0.5);
            z-index: 5;
        }

        /* --- 3. シーサイドブルー (モダン・クリア) --- */
        body[data-theme="ocean"] {
            --bg-gradient: linear-gradient(135deg, #eef9ff 0%, #e1f3fe 50%, #d8f0fa 100%);
            --primary-color: #43b0f1;
            --primary-hover: #1c92d2;
            --text-main: #1e3240;
            --text-sub: #637f94;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: 1px solid #bce3fb;
            --card-radius: 10px;
            --card-shadow: 0 10px 30px rgba(30, 80, 120, 0.1);
            --img-radius: 6px;
            --title-font: 'Quicksand', sans-serif;
            --title-gradient: linear-gradient(45deg, #1c3b57, #3a7bd5);
            --note-bg: rgba(230, 245, 255, 0.7);
            --note-border: 1px solid #82cdff;
            --note-radius: 8px;
            --note-transform: rotate(0deg);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.9);
            --focus-glow: 0 0 0 4px #43b0f1, 0 0 25px rgba(67, 176, 241, 0.65);
        }

        /* --- 4. ノスタルジックヴィンテージ (クラシック・ステッチ感) --- */
        body[data-theme="vintage"] {
            --bg-gradient: linear-gradient(135deg, #f4efe9 0%, #e8dfd5 50%, #ded3c5 100%);
            --primary-color: #a0826c;
            --primary-hover: #836551;
            --text-main: #362f2d;
            --text-sub: #7a6e6a;
            --card-bg: #f7f3ec;
            --card-border: 2px dashed #bdaaa0;
            --card-radius: 4px;
            --card-shadow: 0 10px 25px rgba(50, 40, 30, 0.15);
            --img-radius: 2px;
            --title-font: 'Shippori Mincho', serif;
            --title-gradient: linear-gradient(45deg, #3d312a, #735a4c);
            --note-bg: #eae3d5;
            --note-border: 1px solid #c4b5a3;
            --note-radius: 2px;
            --note-transform: rotate(-1.5deg);
            --glass-bg: rgba(248, 244, 239, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --focus-glow: 0 0 0 4px #a0826c, 0 0 25px rgba(160, 130, 108, 0.65);
        }

        /* --- 5. シネマティックダーク (スタイリッシュ・ゴールド枠) --- */
        body[data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #141215 0%, #1f1b22 50%, #100e12 100%);
            --primary-color: #e0a96d;
            --primary-hover: #cca047;
            --text-main: #f0ebe5;
            --text-sub: #a89f91;
            --card-bg: #221d26;
            --card-border: 1px solid rgba(224, 169, 109, 0.3);
            --card-radius: 12px;
            --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            --img-radius: 8px;
            --title-font: 'Shippori Mincho', serif;
            --title-gradient: linear-gradient(45deg, #ffffff, #e0a96d);
            --note-bg: #2c2632;
            --note-border: 1px solid #e0a96d;
            --note-radius: 6px;
            --note-transform: rotate(0deg);
            --glass-bg: rgba(30, 25, 35, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --focus-glow: 0 0 0 4px #e0a96d, 0 0 30px rgba(224, 169, 109, 0.8);
        }

        /* --- ページ遷移アニメーション --- */
        ::view-transition-old(root) { animation: fade-zoom-out 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        ::view-transition-new(root) { animation: fade-zoom-in 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        @keyframes fade-zoom-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.96); } }
        @keyframes fade-zoom-in { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            font-family: var(--title-font);
            margin: 0;
            padding: 30px 40px;
            overflow-y: hidden;
            position: relative;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* --- TV GUI風 フォーカス強調表示 --- */
        :focus { outline: none; }

        /* TV GUI フォーカス時の強調（ランダムな傾きを一旦リセットして大きく見せる） */
        .focusable:focus {
            box-shadow: var(--focus-glow) !important;
            /* フォーカスが当たった時はまっすぐにして手前に拡大表示 */
            transform: translateY(-10px) rotate(0deg) scale(1.08) !important;
            z-index: 100 !important;
            border-color: var(--primary-color) !important;
        }

        .delete-btn:focus {
            opacity: 1 !important;
            transform: scale(1.2) !important;
            box-shadow: 0 0 0 3px #e65b5b, 0 0 15px rgba(230, 91, 91, 0.5) !important;
        }

        /* 長押し中の演出スタイル */
        .photo-card.holding {
            transform: scale(0.96) rotate(0deg) !important;
            border: 3px solid #e74c3c !important;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.6) !important;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1) !important;
        }

        .album-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px; /* タイトルとQRコードの間の余白 */
            margin-bottom: 20px;
            padding: 10px 20px;
            position: relative;
        }

        h1 {
            text-align: center; font-size: 2.2em; font-weight: 700; letter-spacing: -0.02em; margin: 0;
            background: var(--title-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            transition: background 0.4s ease;
        }

        /* --- テーマ切り替えパレット --- */
        .theme-bar {
            position: fixed;
            top: 25px;
            left: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 8px 16px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--glass-border);
            z-index: 100;
        }

        .theme-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
        }

        .theme-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            position: relative;
        }

        .theme-dot.active {
            transform: scale(1.25);
            box-shadow: 0 0 0 3px var(--primary-color), 0 4px 12px rgba(0,0,0,0.25);
            border-color: #ffffff;
            z-index: 2;
        }

        .theme-dot[data-theme="default"] { background: #f7a072; }
        .theme-dot[data-theme="pastel"] { background: #ff9ebb; }
        .theme-dot[data-theme="ocean"] { background: #43b0f1; }
        .theme-dot[data-theme="vintage"] { background: #a0826c; }
        .theme-dot[data-theme="dark"] { background: #2a252d; border-color: #e0a96d; }

        /* --- アルバムカード領域 --- */
        .album-container {
            display: flex; flex-direction: row; align-items: flex-start; overflow-x: auto;
            white-space: nowrap; padding: 40px 20px 60px 20px; height: 75vh; scroll-behavior: smooth;
        }

        /* スクロールバー全体の高さ（8px → 4pxへ細く） */
        .album-container::-webkit-scrollbar { 
            height: 4px; 
        }
        /* スクロールバーの背景（トラック）を透明化 */
        .album-container::-webkit-scrollbar-track { 
            background: transparent; 
        }
        /* つまみ（バー）を半透明にして目立たなくする */
        .album-container::-webkit-scrollbar-thumb { 
            background: rgba(0, 0, 0, 0.15); 
            border-radius: 10px; 
        }
        /* ホバーした時だけ少し濃く見せる */
        .album-container::-webkit-scrollbar-thumb:hover { 
            background: rgba(0, 0, 0, 0.3); 
        }

        .photo-card {
            display: inline-flex; 
            flex-direction: column; 
            background: var(--card-bg); 
            padding: 12px;
            margin: 0 15px; /* マージンを少し狭めて重ね感を微調整 */
            border-radius: var(--card-radius); 
            box-shadow: var(--card-shadow);
            border: var(--card-border);
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.35s ease; 
            flex-shrink: 0; 
            width: 260px; 
            position: relative;
            cursor: pointer;

            /* --- ランダム配置用の変数を適用 --- */
            /* デフォルトは0deg / 0px。JSで動的に個別の値を設定します */
            transform: translateY(var(--offset-y, 0px)) rotate(var(--rotate, 0deg));
        }

        .delete-btn {
            position: absolute; top: -10px; right: -10px; background: #ffffff; color: #e65b5b;
            border: 1px solid rgba(0,0,0,0.05); border-radius: 50%; width: 32px; height: 32px;
            font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center;
            justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: all 0.2s ease;
            opacity: 0; transform: scale(0.8); z-index: 20;
        }

        .photo-card:hover .delete-btn { opacity: 1; transform: scale(1); }
        .photo-card img { 
            width: 100%; height: auto; max-height: 380px; object-fit: contain; 
            border-radius: var(--img-radius); display: block; 
        }

        .sticky-note {
            background: var(--note-bg); 
            margin-top: 15px; 
            padding: 12px 14px 10px 14px;
            border-radius: var(--note-radius); 
            box-shadow: 2px 4px 12px rgba(0,0,0,0.06); 
            position: relative;
            transform: var(--note-transform); 
            border-left: var(--note-border);
            transition: all 0.4s ease;
        }

        .photo-comment { color: var(--text-main); font-size: 13px; font-weight: 500; line-height: 1.5; white-space: normal; word-wrap: break-word; text-align: left; }
        .photo-date { font-size: 10px; font-weight: 700; color: var(--text-sub); text-align: right; margin-top: 8px; }

        .qr-container {
            /* fixed配置を解除してヘッダー内に収める */
            position: relative; 
            top: auto;
            right: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border-radius: 16px;
            text-align: center;
            z-index: 10;
            border: 1px solid var(--glass-border);
            width: auto; /* サイズをコンパクトに調整 */
            flex-shrink: 0;
        }

        .qr-container img { 
            width: 70px;  /* タイトル横に収まりやすいよう少し小ぶりに調整 */
            height: 70px; 
            display: block; 
            margin: 0 auto; 
            border-radius: 8px; 
            background: #ffffff; 
            padding: 4px; 
        }

        .qr-text { 
            font-size: 10px; 
            color: var(--text-main); 
            margin-top: 6px; 
            white-space: nowrap; 
            font-weight: 700; 
            line-height: 1.2; 
        }

        .empty-album {
            color: var(--text-sub);
            font-size: 16px;
            margin: auto;
            text-align: center;
        }

        /* --- モーダル共通スタイル --- */
        .modal-overlay {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background: rgba(15, 12, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none; /* ← 通常時は完全に非表示(none)にする */
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 9999; /* ← 他の要素(theme-barやqr-container: z-index 100)より確実に前面に配置 */
        }
        
        .modal-overlay.active {
            display: flex !important; /* ← activeクラスがついたらflex表示にする */
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-content img {
            max-width: 85vw;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .modal-caption {
            background: rgba(255, 255, 255, 0.95);
            color: #3d3531;
            padding: 16px 24px;
            border-radius: 16px;
            margin-top: 20px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            white-space: normal;
        }

        .modal-comment {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #2b2523;
        }

        .modal-date {
            font-size: 12px;
            color: #8c7d75;
            font-weight: 500;
        }

        /* --- TV UI 削除確認ポップアップスタイル --- */
        .delete-dialog {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            max-width: 420px;
            width: 90%;
        }

        .delete-dialog h3 {
            margin: 0 0 10px 0;
            color: #3d3531;
            font-size: 1.4em;
        }

        .delete-dialog p {
            margin: 0 0 25px 0;
            color: #8c7d75;
            font-size: 0.95em;
        }

        .delete-dialog-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .modal-btn {
            padding: 12px 28px;
            border-radius: 12px;
            border: 2px solid transparent;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            background: #f0ece9;
            color: #3d3531;
            transition: all 0.2s ease;
        }

        .modal-btn.danger {
            background: #e74c3c;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <!-- テーマ切り替えバー（画面左上） -->
    <div class="theme-bar" id="themeBar">
        <span class="theme-label">テーマ</span>
        <div class="theme-dot focusable active" tabindex="0" data-theme="default" title="暖色クラシック"></div>
        <div class="theme-dot focusable" tabindex="0" data-theme="pastel" title="パステルスイート"></div>
        <div class="theme-dot focusable" tabindex="0" data-theme="ocean" title="シーサイドブルー"></div>
        <div class="theme-dot focusable" tabindex="0" data-theme="vintage" title="ノスタルジック"></div>
        <div class="theme-dot focusable" tabindex="0" data-theme="dark" title="シネマティック"></div>
    </div>

    <header class="album-header">
        <h1 id="albumTitle">アルバム</h1>
        <!-- タイトルの右側に配置 -->
        <div class="qr-container" id="qrContainer">
            <img id="qrImage" src="" alt="QR Code">
            <div class="qr-text">スマホで送る</div>
        </div>
    </header>

    <div class="album-container" id="albumContainer"></div>

    <!-- 全画面拡大用モーダル -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <img id="modalImg" src="" alt="Enlarged Memory">
            <div class="modal-caption" id="modalCaption">
                <div class="modal-comment" id="modalComment"></div>
                <div class="modal-date" id="modalDate"></div>
            </div>
        </div>
    </div>

    <!-- TV UI 削除確認ポップアップモーダル -->
    <div class="modal-overlay" id="deleteModalOverlay">
        <div class="delete-dialog">
            <h3>写真を削除しますか？</h3>
            <p>この操作は取り消せません。</p>
            <div class="delete-dialog-actions">
                <button id="cancelDeleteBtn" class="modal-btn focusable" tabindex="0">キャンセル</button>
                <button id="confirmDeleteBtn" class="modal-btn danger focusable" tabindex="0">削除する</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, query, where, onSnapshot, doc, getDoc, updateDoc, deleteDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAt3p_mTcyr7XH0xSWcPI9VCU1mzzr4IEk",
          authDomain: "family-album-studio.firebaseapp.com",
          projectId: "family-album-studio",
          storageBucket: "family-album-studio.firebasestorage.app",
          messagingSenderId: "10247247724",
          appId: "1:10247247724:web:749f7f1c5f30397de2c549",
          measurementId: "G-TXM3QH522D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const albumId = urlParams.get('albumId');

        let justClosedModal = false; // モーダルを閉じた直後か判定するフラグ
        
        if (!albumId) {
            alert("アルバムIDが見つかりません。一覧に戻ります。");
            window.location.href = "index.html";
        }

        // --- テーマ変更 ＆ アクティブ表示切り替え ＆ Firestore保存 ---
        async function applyTheme(themeName, saveToDb = true) {
            document.body.setAttribute('data-theme', themeName);

            document.querySelectorAll('.theme-dot').forEach(dot => {
                if (dot.getAttribute('data-theme') === themeName) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });

            if (saveToDb && albumId) {
                try {
                    const albumRef = doc(db, "albums", albumId);
                    await updateDoc(albumRef, { theme: themeName });
                } catch (err) {
                    console.error("テーマの保存に失敗しました:", err);
                }
            }
        }

        document.querySelectorAll('.theme-dot').forEach(dot => {
            dot.addEventListener('click', () => {
                const selectedTheme = dot.getAttribute('data-theme');
                applyTheme(selectedTheme, true);
            });
        });

        // --- 全画面拡大モーダル制御機能 ---
        const modalOverlay = document.getElementById('modalOverlay');
        const modalImg = document.getElementById('modalImg');
        const modalComment = document.getElementById('modalComment');
        const modalDate = document.getElementById('modalDate');
        const modalCaption = document.getElementById('modalCaption');
        let isModalOpen = false;
        let lastFocusedElement = null;

        function openModal(imgUrl, comment, dateStr) {
            lastFocusedElement = document.activeElement;
            modalImg.src = imgUrl;

            if (comment || dateStr) {
                modalCaption.style.display = 'block';
                modalComment.innerText = comment || '';
                modalDate.innerText = dateStr || '';
            } else {
                modalCaption.style.display = 'none';
            }

            modalOverlay.classList.add('active');
            isModalOpen = true;
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            isModalOpen = false;
            if (lastFocusedElement) {
                lastFocusedElement.focus();
            }
        }

        modalOverlay.addEventListener('click', closeModal);

        // --- 削除確認ポップアップ制御 ---
        const deleteModalOverlay = document.getElementById('deleteModalOverlay');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        let isDeleteModalOpen = false;
        let pendingDeletePhotoId = null;

        let holdTimer = null;
        let holdingVisualTimer = null; // ← 赤枠表示用のタイマーを追加
        const HOLD_DURATION = 800; // 800ms長押しで発動
        const VISUAL_DELAY = 200;  // ← 200ms押され続けたら赤枠（holding）を表示
        let isHoldTriggered = false;

        function openDeleteModal(photoId) {
            pendingDeletePhotoId = photoId;
            lastFocusedElement = document.activeElement;
            
            deleteModalOverlay.classList.add('active');
            isDeleteModalOpen = true;
            
            // ダイアログ内のキャンセルボタンへ確実にフォーカスをあてる
            setTimeout(() => {
                cancelDeleteBtn.focus();
            }, 50);
        }

        function closeDeleteModal() {
            deleteModalOverlay.classList.remove('active');
            isDeleteModalOpen = false;
            pendingDeletePhotoId = null;

            // Enterキーが放された後（または少し遅れて）フォーカスを戻す
            // isEnterPressed が false になるのを待ってフォーカスを戻す
            const restoreFocus = () => {
                if (isEnterPressed) {
                    setTimeout(restoreFocus, 50);
                    return;
                }
                if (lastFocusedElement) {
                    lastFocusedElement.classList.remove('holding');
                    lastFocusedElement.focus();
                }
            };

            setTimeout(restoreFocus, 100);
        }

        cancelDeleteBtn.addEventListener('click', closeDeleteModal);

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!pendingDeletePhotoId) return;
            try {
                await deleteDoc(doc(db, "shared_photos", pendingDeletePhotoId));
                closeDeleteModal();
            } catch (firestoreError) {
                console.error("Firestoreの削除エラー:", firestoreError);
            }
        });

        // --- TV GUI キーボードナビゲーション ＆ 長押し処理 ---
        function getFocusables() {
            return Array.from(document.querySelectorAll('.focusable'));
        }

        // 長押し状態・キー押しっぱなしを管理するフラグ
        let isEnterPressed = false; 

        document.addEventListener('keydown', (e) => {
            // 1. 削除モーダル展開中
            if (isDeleteModalOpen) {
                if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (document.activeElement === cancelDeleteBtn) {
                        confirmDeleteBtn.focus();
                    } else {
                        cancelDeleteBtn.focus();
                    }
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!e.repeat) {
                        justClosedModal = true; // ← このEnterでモーダルが閉じるためフラグを立てる
                        document.activeElement.click();
                    }
                } else if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') {
                    e.preventDefault();
                    closeDeleteModal();
                }
                return;
            }

            // 2. 拡大モーダル展開中
            if (isModalOpen) {
                if (e.key === 'b' || e.key === 'B' || e.key === 'Escape') {
                    e.preventDefault();
                    closeModal();
                }
                return;
            }

            // 戻るショートカット
            if (e.key === 'b' || e.key === 'B') {
                window.location.href = "index.html";
                return;
            }

            const focusables = getFocusables();
            if (focusables.length === 0) return;

            const active = document.activeElement;
            let currentIndex = focusables.indexOf(active);

            // --- 長押し判定処理 (Enter) ---
            if (e.key === 'Enter') {
                e.preventDefault();
    
                if (active && active.classList.contains('photo-card')) {
                    if (!e.repeat && !isEnterPressed) {
                        isEnterPressed = true;
                        isHoldTriggered = false;
    
                        // ① 200ms押され続けたら赤枠をつける（短押しの時は発動する前にクリアされる）
                        holdingVisualTimer = setTimeout(() => {
                            active.classList.add('holding');
                        }, VISUAL_DELAY);
    
                        // ② 800ms押され続けたら削除ダイアログを開く
                        holdTimer = setTimeout(() => {
                            isHoldTriggered = true;
                            active.classList.remove('holding');
                            const photoId = active.getAttribute('data-id');
                            openDeleteModal(photoId);
                        }, HOLD_DURATION);
                    }
                } else if (!e.repeat) {
                    if (active.classList.contains('theme-dot')) {
                        active.click();
                    } else if (active.classList.contains('delete-btn')) {
                        active.click();
                    }
                }
                return;
            }

            if (currentIndex === -1) {
                focusables[0].focus();
                return;
            }

            if (e.key === 'ArrowRight') {
                e.preventDefault();
                const next = focusables[currentIndex + 1] || focusables[0];
                next.focus();
                if (next.classList.contains('photo-card')) {
                    next.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                const prev = focusables[currentIndex - 1] || focusables[focusables.length - 1];
                prev.focus();
                if (prev.classList.contains('photo-card')) {
                    prev.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (active.classList.contains('theme-dot')) {
                    const firstPhoto = document.querySelector('.photo-card.focusable');
                    if (firstPhoto) firstPhoto.focus();
                } else if (active.classList.contains('photo-card')) {
                    const deleteBtn = active.querySelector('.delete-btn');
                    if (deleteBtn) deleteBtn.focus();
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (active.classList.contains('delete-btn')) {
                    active.closest('.photo-card').focus();
                } else if (active.classList.contains('photo-card')) {
                    const firstThemeDot = document.querySelector('.theme-dot.focusable');
                    if (firstThemeDot) firstThemeDot.focus();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                // 赤枠用タイマーと長押し用タイマーの両方をクリア
                if (holdingVisualTimer) {
                    clearTimeout(holdingVisualTimer);
                    holdingVisualTimer = null;
                }
                if (holdTimer) {
                    clearTimeout(holdTimer);
                    holdTimer = null;
                }

                // 見た目の長押しスタイル解除
                document.querySelectorAll('.photo-card.holding').forEach(el => el.classList.remove('holding'));

                // 【修正ポイント】 justClosedModal フラグのチェックを追加
                if (!isHoldTriggered && !isDeleteModalOpen && !isModalOpen && !justClosedModal) {
                    const active = document.activeElement;
                    if (active && active.classList.contains('photo-card')) {
                        const imgUrl = active.getAttribute('data-img');
                        const comment = active.getAttribute('data-comment');
                        const dateStr = active.getAttribute('data-date');
                        openModal(imgUrl, comment, dateStr);
                    }
                }

                isEnterPressed = false;
                isHoldTriggered = false;
                justClosedModal = false; // keyupが完了したらフラグを戻す
            }
        });

        // アルバム情報取得
        async function fetchAlbumInfo() {
            try {
                const albumRef = doc(db, "albums", albumId);
                const albumSnap = await getDoc(albumRef);
                if (albumSnap.exists()) {
                    const data = albumSnap.data();
                    const title = data.name || data.title || "無題のアルバム";
                    document.getElementById('albumTitle').innerText = title;
                    document.title = `${title} | Memory Album`;

                    if (data.theme) {
                        applyTheme(data.theme, false);
                    }
                }
            } catch (error) {
                console.error("アルバム情報の取得エラー:", error);
            }
        }
        fetchAlbumInfo();

        // QRコード生成
        const baseUrl = window.location.origin + window.location.pathname.replace(/albumcreate\.html$/, '');
        const shareUrl = `${baseUrl}photoshare.html?albumId=${albumId}`;
        document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(shareUrl)}`;

        const albumContainer = document.getElementById('albumContainer');
        const q = query(collection(db, "shared_photos"), where("albumId", "==", albumId));
        
        onSnapshot(q, (snapshot) => {
            albumContainer.innerHTML = '';
            
            if (snapshot.empty) {
                albumContainer.innerHTML = '<div class="empty-album">写真がまだありません。<br>右上のQRコードからスマホで写真を送信してください。<br><small style="opacity:0.7; margin-top:8px; display:inline-block;">[B]キーでアルバム一覧へ戻る</small></div>';
                return;
            }

            const photos = [];
            snapshot.forEach((doc) => { photos.push({ id: doc.id, ...doc.data() }); });
            photos.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

            photos.forEach((data, index) => {
                let dateStr = '';
                if (data.createdAt) {
                    const date = data.createdAt.toDate();
                    dateStr = `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
                }

                const card = document.createElement('div');
                card.className = 'photo-card focusable';
                card.tabIndex = 0;
                card.setAttribute('data-id', data.id);
                card.setAttribute('data-img', data.imageUrl || '');
                card.setAttribute('data-comment', data.comment || '');
                card.setAttribute('data-date', dateStr);

                // --- 【追加】手貼りアルバム風のランダム値を設定 ---
                // ① -3.5度 〜 +3.5度 のランダムな回転
                const randomRotate = (Math.sin(index * 999) * 5).toFixed(1); 
                // ② -25px 〜 +25px のランダムな上下ズレ
                const randomOffsetY = (Math.cos(index * 888) * 30).toFixed(1);
                // ③ 【追加】幅を 245px 〜 280px の範囲でランダム化（基本サイズ260px前後）
                const randomWidth = (260 + Math.sin(index * 777) * 20).toFixed(0);
                
                card.style.setProperty('--rotate', `${randomRotate}deg`);
                card.style.setProperty('--offset-y', `${randomOffsetY}px`);

                card.innerHTML = `
                    <button class="delete-btn" data-id="${data.id}" title="削除" tabindex="-1">×</button>
                    <img src="${data.imageUrl}" alt="Memory">
                    ${data.comment ? `
                        <div class="sticky-note">
                            <div class="photo-comment">${data.comment}</div>
                            <div class="photo-date">${dateStr}</div>
                        </div>
                    ` : `
                        <div class="photo-date" style="margin-top: 8px;">${dateStr}</div>
                    `}
                `;

                card.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-btn')) return;
                    openModal(data.imageUrl, data.comment, dateStr);
                });

                albumContainer.appendChild(card);
            });

            // マウスクリック用の削除ボタンイベント
            const deleteButtons = document.querySelectorAll('.delete-btn');
            deleteButtons.forEach(button => {
                button.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = e.currentTarget.getAttribute('data-id');
                    openDeleteModal(id);
                });
            });

            // フォーカス位置調整
            if (!isModalOpen && !isDeleteModalOpen) {
                const active = document.activeElement;
                if (!active || (!active.classList.contains('focusable') && !active.classList.contains('delete-btn'))) {
                    const firstPhoto = document.querySelector('.photo-card.focusable');
                    if (firstPhoto) firstPhoto.focus();
                }
            }
        });
    </script>
</body>
</html>
