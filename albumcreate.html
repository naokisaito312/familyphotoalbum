<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Our Memory Album</title>
    <style>
        body {
            background-color: #2c1d11; /* 古い木製テーブルのような暗い茶色 */
            background-image: radial-gradient(rgba(0,0,0,0.3) 20%, transparent 80%);
            color: #f5ebe0;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 40px;
            overflow-y: hidden; /* 縦スクロールを防ぐ */
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            margin-bottom: 30px;
            color: #e6ccb2;
        }
        /* 横スクロールするアルバムコンテナ */
        .album-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            overflow-x: auto; /* 横スクロールを有効に */
            white-space: nowrap;
            padding: 20px;
            height: 70vh;
            scroll-behavior: smooth;
        }
        /* チェキ風の写真フレーム */
        .photo-card {
            display: inline-block;
            background: #fdfbf7; /* 少し黄ばんだ白 */
            padding: 15px 15px 30px 15px;
            margin: 0 25px;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.5);
            transform: rotate(-2deg); /* 少し傾けてエモさを演出 */
            transition: transform 0.3s ease;
            flex-shrink: 0;
            width: 250px;
            position: relative; /* 削除ボタンの配置基準 */
        }
        /* 交互に傾きを変える */
        .photo-card:nth-child(even) {
            transform: rotate(3deg);
        }
        .photo-card:hover {
            transform: scale(1.05) rotate(0deg);
            z-index: 10;
        }
        /* 削除ボタンのデザイン */
        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(139, 90, 43, 0.8); /* レトロな茶色半透明 */
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background 0.2s;
            opacity: 0; /* 普段は非表示 */
            z-index: 2; /* ★この行を追加して、写真より手前に表示させます */
        }
        /* カードにホバーした時だけ削除ボタンを表示 */
        .photo-card:hover .delete-btn {
            opacity: 1;
        }
        .delete-btn:hover {
            background: #d9534f; /* ホバー時は赤色に */
        }
        .photo-card img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            filter: sepia(0.3) contrast(0.9) brightness(0.95); /* セピア・レトロ加工 */
            border: 1px solid #ddd;
        }
        .photo-comment {
            margin-top: 15px;
            font-family: 'Courier New', Courier, monospace; /* 手書き風・���イプライター風 */
            color: #4a3b32;
            font-size: 14px;
            white-space: normal;
            word-wrap: break-word;
            text-align: center;
        }
        .photo-date {
            font-size: 11px;
            color: #8c7a6b;
            text-align: right;
            margin-top: 5px;
        }
        /* QRコードエリアのデザイン（画面右上に固定） */
        .qr-container {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #fdfbf7; /* チェキと同じ少し黄ばんだ白 */
            padding: 12px;
            box-shadow: 3px 5px 15px rgba(0,0,0,0.5);
            border-radius: 4px;
            text-align: center;
            z-index: 100; /* 常に最前面に表示 */
            transform: rotate(1deg); /* 少し傾けてエモさを演出 */
            border: 1px solid #ddd;
            width: 120px;
        }
        .qr-container img {
            width: 120px;
            height: 120px;
            display: block;
            margin: 0 auto;
        }
        .qr-text {
            font-size: 10px;
            color: #4a3b32;
            margin-top: 8px;
            font-family: sans-serif;
            white-space: normal;
            font-weight: bold;
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <!-- 追加：QRコード表示エリア -->
    <div class="qr-container" id="qrContainer">
        <img id="qrImage" src="" alt="QR Code">
        <div class="qr-text">スマホでスキャンして<br>写真を送る</div>
    </div>
    
    <h1>Our Memory Album</h1>
    <div class="album-container" id="albumContainer">
        <!-- 写真カードがここに動的に追加されます -->
    </div>

    <!-- Firebase SDK の読み込み -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // TODO: あなたのFirebaseプロジェクトの構成情報をここに貼り付けてください
        const firebaseConfig = {
          apiKey: "AIzaSyAt3p_mTcyr7XH0xSWcPI9VCU1mzzr4IEk",
          authDomain: "family-album-studio.firebaseapp.com",
          projectId: "family-album-studio",
          storageBucket: "family-album-studio.firebasestorage.app",
          messagingSenderId: "10247247724",
          appId: "1:10247247724:web:749f7f1c5f30397de2c549",
          measurementId: "G-TXM3QH522D"
        };

        // --- QRコード自動生成処理 ---
        // 現在のPC画面のURLを取得
        const currentUrl = window.location.href;
        // 「albumcreate.html」の部分を「photoshare.html」に置き換える
        const shareUrl = currentUrl.replace('albumcreate.html', 'photoshare.html');
        
        // 無料のQRコード生成APIを利用して、画像をセット
        const qrImage = document.getElementById('qrImage');
        qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(shareUrl)}`;
        // ----------------------------
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const albumContainer = document.getElementById('albumContainer');

        // データのリアルタイム監視（作成日時順にソート）
        const q = query(collection(db, "shared_photos"), orderBy("createdAt", "asc"));
        
        onSnapshot(q, (snapshot) => {
            albumContainer.innerHTML = ''; // 画面をクリアして再描画
            
            snapshot.forEach((documentSnapshot) => {
                const data = documentSnapshot.data();
                const docId = documentSnapshot.id; // ドキュメントIDを取得
                
                // 日付のフォーマット
                let dateStr = '';
                if (data.createdAt) {
                    const date = data.createdAt.toDate();
                    dateStr = `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
                }

                // カード要素の作成
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <button class="delete-btn" data-id="${docId}" data-url="${data.imageUrl}">×</button>
                    <img src="${data.imageUrl}" alt="Memory">
                    <div class="photo-comment">${data.comment || ''}</div>
                    <div class="photo-date">${dateStr}</div>
                `;
                albumContainer.appendChild(card);
            });

            // 削除ボタンにイベントリスナーを設定
            const deleteButtons = document.querySelectorAll('.delete-btn');
            deleteButtons.forEach(button => {
                button.addEventListener('click', async (e) => {
                    // e.target を e.currentTarget に変更（より確実にボタン要素を指すようにします）
                    const id = e.currentTarget.getAttribute('data-id');
                    const imageUrl = e.currentTarget.getAttribute('data-url');
                    
                    // デバッグ用：取得したデータをコンソールに表示
                    console.log("削除対象 ID:", id);
                    console.log("削除対象 URL:", imageUrl);

                    if (!id || !imageUrl) {
                        alert("削除に必要なデータが見つかりません。");
                        return;
                    }
                    
                    if (confirm('この写真をアルバムから削除してもよろしいですか？')) {
                        try {
                            // 1. Cloud Storageから画像ファイルを削除
                            const imageRef = ref(storage, imageUrl);
                            await deleteObject(imageRef);
                            console.log("Storageの画像削除 成功");

                            // 2. Firestoreからデータを削除
                            await deleteDoc(doc(db, "shared_photos", id));
                            console.log("Firestoreのデータ削除 成功");

                            alert('削除しました。');
                        } catch (error) {
                            // エラーの詳細をコンソールに出力
                            console.error("削除エラーの詳細:", error);
                            alert('削除に失敗しました。エラー内容はコンソールを確認してください。');
                        }
                    }
                });
            });

            // 新しい写真が追加されたら、自動で一番右にスクロール
            albumContainer.scrollLeft = albumContainer.scrollWidth;
        });
    </script>
</body>
</html>
