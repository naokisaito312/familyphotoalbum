<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memory Album</title>
    <!-- Webフォント（Google Fonts: Quicksand / M PLUS Rounded 1c） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #f7a072;
            --primary-hover: #f38345;
            --text-main: #3d3531;
            --text-sub: #8c7d75;
            --card-bg: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.8);
            --shadow-soft: 0 10px 30px rgba(180, 140, 120, 0.15);
            --shadow-card: 0 12px 24px rgba(60, 40, 30, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            /* 温かみのあるサンドベージュ〜ソフトアプリコットの現代的グラデーション */
            background: linear-gradient(135deg, #fefaf6 0%, #f7ede2 50%, #f5e6d8 100%);
            min-height: 100vh;
            color: var(--text-main);
            font-family: 'Quicksand', 'M PLUS Rounded 1c', -apple-system, sans-serif;
            margin: 0;
            padding: 30px 40px;
            overflow-y: hidden;
            position: relative;
        }

        /* --- ヘッダーエリア --- */
        .album-header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            padding: 10px 20px;
        }

        .back-link {
            position: absolute;
            left: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .back-link:hover {
            background: #ffffff;
            color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(247, 160, 114, 0.25);
        }

        .back-link .arrow {
            font-size: 16px;
            transition: transform 0.2s ease;
        }

        .back-link:hover .arrow {
            transform: translateX(-4px);
        }

        h1 {
            text-align: center;
            font-size: 2.2em;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
            color: #2b2523;
            background: linear-gradient(45deg, #4a3e3d, #8f6b58);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- アルバム横スクロールコンテナ --- */
        .album-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
            padding: 30px 20px;
            height: 72vh;
            scroll-behavior: smooth;
        }

        /* スクロールバーのカスタマイズ */
        .album-container::-webkit-scrollbar {
            height: 8px;
        }
        .album-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 10px;
        }
        .album-container::-webkit-scrollbar-thumb {
            background: rgba(247, 160, 114, 0.4);
            border-radius: 10px;
        }
        .album-container::-webkit-scrollbar-thumb:hover {
            background: rgba(247, 160, 114, 0.7);
        }

        /* --- 写真カード（洗練された洗練カード） --- */
        .photo-card {
            display: inline-flex;
            flex-direction: column;
            background: var(--card-bg);
            padding: 14px;
            margin: 0 20px;
            border-radius: 20px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            width: 270px;
            position: relative;
        }

        .photo-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 35px rgba(120, 80, 60, 0.15);
            z-index: 10;
        }

        /* 削除ボタン */
        .delete-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #e65b5b;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            transition: all 0.2s ease;
            opacity: 0;
            transform: scale(0.8);
            z-index: 2;
        }

        .photo-card:hover .delete-btn {
            opacity: 1;
            transform: scale(1);
        }

        .delete-btn:hover {
            background: #e65b5b;
            color: #ffffff;
            transform: scale(1.1);
        }

        .photo-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 14px;
            /* 古いセピアを排除し、鮮やかで綺麗な発色に */
            transition: filter 0.3s ease;
        }

        .photo-comment {
            margin-top: 14px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
            white-space: normal;
            word-wrap: break-word;
            text-align: center;
            padding: 0 6px;
        }

        .photo-date {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            text-align: right;
            margin-top: 10px;
            padding-right: 4px;
        }

        /* --- QRコードフローティングパネル（ガラスモフィズム） --- */
        .qr-container {
            position: fixed;
            top: 25px;
            right: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 16px;
            box-shadow: var(--shadow-soft);
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            border: 1px solid var(--glass-border);
            width: 135px;
            transition: transform 0.3s ease;
        }

        .qr-container:hover {
            transform: scale(1.03);
        }

        .qr-container img {
            width: 103px;
            height: 103px;
            display: block;
            margin: 0 auto;
            border-radius: 10px;
            background: #ffffff;
            padding: 5px;
        }

        .qr-text {
            font-size: 11px;
            color: var(--text-main);
            margin-top: 10px;
            white-space: normal;
            font-weight: 700;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <!-- QRコードエリア -->
    <div class="qr-container" id="qrContainer">
        <img id="qrImage" src="" alt="QR Code">
        <div class="qr-text">スマホで送る</div>
    </div>
    
    <!-- ヘッダーエリア -->
    <header class="album-header">
        <a href="index.html" class="back-link">
            <span class="arrow">←</span> アルバム一覧
        </a>
        <h1>Our Memory Album</h1>
    </header>

    <div class="album-container" id="albumContainer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAt3p_mTcyr7XH0xSWcPI9VCU1mzzr4IEk",
          authDomain: "family-album-studio.firebaseapp.com",
          projectId: "family-album-studio",
          storageBucket: "family-album-studio.firebasestorage.app",
          messagingSenderId: "10247247724",
          appId: "1:10247247724:web:749f7f1c5f30397de2c549",
          measurementId: "G-TXM3QH522D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const albumId = urlParams.get('albumId');

        if (!albumId) {
            alert("アルバムIDが見つかりません。一覧に戻ります。");
            window.location.href = "index.html";
        }

        // --- QRコード自動生成処理 ---
        const baseUrl = window.location.origin + window.location.pathname.replace(/albumcreate\.html$/, '');
        const shareUrl = `${baseUrl}photoshare.html?albumId=${albumId}`;
        const qrImage = document.getElementById('qrImage');
        qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(shareUrl)}`;

        const albumContainer = document.getElementById('albumContainer');

        const q = query(collection(db, "shared_photos"), where("albumId", "==", albumId));
        
        onSnapshot(q, (snapshot) => {
            albumContainer.innerHTML = '';
            
            const photos = [];
            snapshot.forEach((doc) => {
                photos.push({ id: doc.id, ...doc.data() });
            });
            photos.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

            photos.forEach((data) => {
                let dateStr = '';
                if (data.createdAt) {
                    const date = data.createdAt.toDate();
                    dateStr = `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
                }

                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <button class="delete-btn" data-id="${data.id}" title="削除">×</button>
                    <img src="${data.imageUrl}" alt="Memory">
                    <div class="photo-comment">${data.comment || ''}</div>
                    <div class="photo-date">${dateStr}</div>
                `;
                albumContainer.appendChild(card);
            });

            const deleteButtons = document.querySelectorAll('.delete-btn');
            deleteButtons.forEach(button => {
                button.addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    try {
                        await deleteDoc(doc(db, "shared_photos", id));
                    } catch (firestoreError) {
                        console.error("Firestoreの削除エラー:", firestoreError);
                    }
                });
            });

            albumContainer.scrollLeft = albumContainer.scrollWidth;
        });
    </script>
</body>
</html>
